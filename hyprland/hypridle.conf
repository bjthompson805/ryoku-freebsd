general {
    lock_cmd = ryoku-shell lock
    before_sleep_cmd = ryoku-shell lock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = backlight -q > "${XDG_RUNTIME_DIR:-/tmp}/ryoku-backlight" && backlight 20
    on-resume = backlight "$(cat "${XDG_RUNTIME_DIR:-/tmp}/ryoku-backlight" 2>/dev/null || echo 100)"
}

listener {
    timeout = 600
    on-timeout = ryoku-shell lock
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = acpiconf -s 3
}
